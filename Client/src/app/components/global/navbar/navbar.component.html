<nav class="navbar">
  <ul class="nolist">
    <li>
      <a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Home">


        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="homeGradient" x1="0" y1="0" x2="0" y2="1">
            </linearGradient>
          </defs>

          <path d="M3 10.2L12 3l9 7.2V21a1 1 0 0 1-1 1h-5v-5a3 3 0 0 0-6 0v5H4a1 1 0 0 1-1-1V10.2z"
            fill="url(#homeGradient)" stroke=" #1e97ca" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
      </a>
    </li>
    <li>
      <a [routerLink]="['/movie']" routerLinkActive="active" aria-label="Movies">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g fill="none" stroke="#fff" stroke-width="1.5" stroke-miterlimit="10" stroke-linejoin="round"
            stroke-linecap="round">
            <path d="M3.2 12.8h19.6v9.5c0 .5-.4.9-1 .9H4.1c-.5 0-1-.4-1-.9v-9.5" />
            <path d="M3.3 13.1l-2-4.4c-.2-.5 0-1 .5-1.2L18 .8c.5-.2 1.1 0 1.3.5l1.8 4-17.5 7.3" />
            <path d="M15 2.1l-.9 6M8 4.7l-1.2 6.6" />
          </g>
        </svg>
      </a>
    </li>
    <li>
      <a [routerLink]="['/tv']" routerLinkActive="active" aria-label="TV Shows">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-miterlimit="10">
            <path
              d="M21.4 23H2.6c-.9 0-1.6-.7-1.6-1.6V8.9c0-.9.7-1.6 1.6-1.6h18.9c.8 0 1.5.7 1.5 1.6v12.6c0 .8-.7 1.5-1.6 1.5zM6.4 1L12 7M17.6 1L12 7" />
          </g>
        </svg>
      </a>
    </li>
    <li>
      <button class="search-toggle" type="button" aria-label="Search" (click)="toggleSearch()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-miterlimit="10">
            <path d="M16.4 16.7l6.3 6.5" />
            <ellipse cx="10.5" cy="9.8" rx="9.2" ry="9.1" />
          </g>
        </svg>
      </button>
    </li>
 
<li>
  <a
    class="profile-link"
    [routerLink]="['/profile']"
    routerLinkActive="profile-active"
    [routerLinkActiveOptions]="{ exact: true }"
    aria-label="profile"
  >
    <svg
      class="profile-icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 128 128"
      width="40"
    >
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6366F1" />
          <stop offset="100%" stop-color="#22D3EE" />
        </linearGradient>
      </defs>

      <!-- BACKGROUND -->
      <circle cx="64" cy="64" r="64" fill="url(#grad)" />

      <!-- ACTIVE RING -->
      <circle
        class="profile-ring"
        cx="64"
        cy="64"
        r="60"
        fill="none"
      />

      <!-- AVATAR -->
      <circle cx="64" cy="48" r="20" fill="#fff" />
      <path
        d="M28 110c4-18 20-30 36-30s32 12 36 30"
        fill="#fff"
      />
    </svg>
  </a>
</li>


  </ul>
</nav>

<div *ngIf="searchVisible">
  <div class="form">
    <form autocomplete="off" (ngSubmit)="onSubmit($event)">
      <label class="visuallyhidden" for="search">Search</label>
      <div class="field">
        <input id="search" #input [(ngModel)]="query" name="search" type="text"
          placeholder="Search for a movie, tv show or person..." (keyup)="goToRoute()" (blur)="unFocus($event)">
        <button *ngIf="query" type="button" aria-label="Close" (click)="goBack()">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15">
            <g fill="none" stroke="#fff" stroke-linecap="round" stroke-miterlimit="10" stroke-width="1.5">
              <path d="M.75.75l13.5 13.5M14.25.75L.75 14.25" />
            </g>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>
